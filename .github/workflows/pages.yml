name: Deploy to GitHub Pages

# The deploy has its own gate: static checks, unit and CLI tests, and the production
# smoke tests against the exact bundle it uploads. The full browser suite in
# application.yml runs on pull requests and is not repeated on main.
on:
  push:
    branches: [main]
    # Mirrors application.yml: nothing in the app or its tests reads Markdown or docs/.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          browsers: chromium webkit
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Verify vendored checksums
        run: (cd fonts && shasum -a 256 -c SHA256SUMS) && (cd vendor/d2 && shasum -a 256 -c SHA256SUMS)
      # CLI integration tests need native D2 and Chromium.
      - uses: ./.github/actions/setup-d2
      - name: Unit and CLI integration tests
        run: pnpm test:unit
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The relative Vite base serves the build from the project path (/zoomflow/).
      # Ask AI needs the local dev server, so the panel stays disabled on Pages.
      - name: Production build
        run: pnpm build
      # CI=true adds the production smoke projects, which serve the build above.
      - name: Production smoke tests in Chromium and WebKit
        run: pnpm exec playwright test --project=production --project=production-webkit --reporter=github,html,./tests/e2e/flaky-reporter.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: pages-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
