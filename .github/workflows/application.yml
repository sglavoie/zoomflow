name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the Chromium visual baselines on macOS and upload the changed PNGs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Typechecking, lint and unit tests do not depend on screenshot baselines, so they
    # run on the cheaper Linux runner. CLI integration tests need native D2 and Chromium.
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from packageManager in package.json (pnpm 12 needs v6.1+).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      # Fail fast on static checks before downloading browsers and D2.
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Verify vendored checksums
        run: (cd fonts && shasum -a 256 -c SHA256SUMS) && (cd vendor/d2 && shasum -a 256 -c SHA256SUMS)
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      # Linux needs system libraries even when the browser itself is cached; a cached
      # browser is not downloaded again.
      - name: Install Chromium for CLI tests
        run: pnpm exec playwright install --with-deps chromium
      - uses: ./.github/actions/setup-d2
      - name: Unit and CLI integration tests with coverage
        run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage.txt') != '' }}
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    # Checked-in PNG and workspace baselines are macOS captures. Keep the runner
    # pinned and review baseline changes when upgrading Playwright or the OS.
    # This job runs Chromium with the visual baselines and the production bundle in
    # Chromium and WebKit; Firefox and WebKit behavior tests run on Linux below.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from packageManager in package.json (pnpm 12 needs v6.1+).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # macOS needs no system dependencies, so a cache hit skips installation entirely.
      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium webkit
      - name: Production build
        run: pnpm build
      - name: Update visual baselines
        if: ${{ inputs.update_snapshots }}
        run: |
          pnpm exec playwright test --project=chromium --update-snapshots \
            tests/e2e/visual.spec.ts tests/e2e/controls-visual.spec.ts \
            tests/e2e/export-visual.spec.ts tests/e2e/touch.spec.ts tests/e2e/export.spec.ts
      - name: Collect changed baselines
        if: ${{ inputs.update_snapshots && !cancelled() }}
        run: |
          mkdir -p snapshot-updates
          git ls-files --modified --others --exclude-standard -- 'tests/e2e/*-snapshots/*' > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then tar -cf - -T "$RUNNER_TEMP/changed.txt" | tar -xf - -C snapshot-updates; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.update_snapshots && !cancelled() }}
        with:
          name: visual-baselines
          path: snapshot-updates/
          if-no-files-found: warn
          retention-days: 14
      - name: Chromium, visual regression and production tests
        if: ${{ !inputs.update_snapshots }}
        # CI=true adds the production smoke projects, which serve the build above.
        run: pnpm exec playwright test --project=chromium --project=production --project=production-webkit --reporter=github,html
      - name: WebKit engine tests on macOS
        if: ${{ !cancelled() && !inputs.update_snapshots }}
        # The vendored D2 build patches a WebKit WASM stack overflow; check it on Safari's platform too.
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/webkit-engine
        run: pnpm exec playwright test tests/e2e/engine.spec.ts --project=webkit --reporter=github,html --output=test-results/webkit-engine
      # Upload after failures and flaky passes alike (flakes fail the run in CI).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && !inputs.update_snapshots }}
        with:
          name: browser-report-macos
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  engines:
    # Firefox and WebKit behavior tests. comparesVisuals in tests/e2e/helpers.ts skips
    # every screenshot comparison off macOS Chromium.
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from packageManager in package.json (pnpm 12 needs v6.1+).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-firefox-webkit
      # Linux needs system libraries even when the browsers are cached; cached
      # browsers are not downloaded again.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps firefox webkit
      # CI=true also starts the production preview server, which needs the build.
      - name: Production build
        run: pnpm build
      - name: Firefox and WebKit behavior tests
        run: pnpm exec playwright test --project=firefox --project=webkit --reporter=github,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-report-linux
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
