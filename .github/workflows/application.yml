name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    # Checked-in PNG and workspace baselines are macOS captures. Keep the runner
    # pinned and review baseline changes when upgrading Playwright or the OS.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # macOS needs no system dependencies, so a cache hit skips installation entirely.
      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit
      - uses: ./.github/actions/setup-d2
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and CLI integration tests
        run: pnpm test:unit
      - name: Production build
        run: pnpm build
      - name: Browser and visual regression tests
        # CI=true adds the production smoke project, which serves the build above.
        run: pnpm exec playwright test --reporter=github,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 14
