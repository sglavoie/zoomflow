name: Application checks

# Pull requests run the full suite; a merge to main does not repeat it. The Pages
# deploy keeps its own gate (static checks, unit and CLI tests, production smoke tests).
# Nothing in the app or its tests reads Markdown or docs/, so those changes skip it.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - LICENSE
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the Chromium visual baselines on macOS and upload the changed PNGs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Typechecking, lint and unit tests do not depend on screenshot baselines, so they
    # run on the cheaper Linux runner. CLI integration tests need native D2 and Chromium.
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CLI integration tests need Chromium; the cached install takes seconds.
      - uses: ./.github/actions/setup-workspace
        with:
          browsers: chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Verify vendored checksums
        run: (cd fonts && shasum -a 256 -c SHA256SUMS) && (cd vendor/d2 && shasum -a 256 -c SHA256SUMS)
      - uses: ./.github/actions/setup-d2
      - name: Unit and CLI integration tests with coverage
        run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage.txt') != '' }}
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    # Checked-in PNG and workspace baselines are macOS captures. Keep the runner
    # pinned and review baseline changes when upgrading Playwright or the OS.
    # This job runs Chromium with the visual baselines and the production bundle in
    # Chromium and WebKit; Firefox and WebKit behavior tests run on Linux below.
    # Each shard keeps the configured two workers, so per-machine load is unchanged.
    if: ${{ !inputs.update_snapshots }}
    name: browser (${{ matrix.shard }}/2)
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          browsers: chromium webkit
      - name: Production build
        run: pnpm build
      - name: Chromium, visual regression and production tests
        # CI=true adds the production smoke projects, which serve the build above.
        run: pnpm exec playwright test --project=chromium --project=production --project=production-webkit --shard=${{ matrix.shard }}/2 --reporter=github,html,./tests/e2e/flaky-reporter.ts
      - name: WebKit engine tests on macOS
        if: ${{ !cancelled() && matrix.shard == 1 }}
        # The vendored D2 build patches a WebKit WASM stack overflow; check it on Safari's platform too.
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/webkit-engine
        run: pnpm exec playwright test tests/e2e/engine.spec.ts --project=webkit --reporter=github,html,./tests/e2e/flaky-reporter.ts --output=test-results/webkit-engine
      # Upload after failures and flaky passes alike (flakes are reported as warnings).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-report-macos-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  engines:
    # Firefox and WebKit behavior tests, one job per browser and shard. comparesVisuals
    # in tests/e2e/helpers.ts skips every screenshot comparison off macOS Chromium.
    if: ${{ !inputs.update_snapshots }}
    name: engines (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          browsers: ${{ matrix.browser }}
      # CI=true also starts the production preview server, which needs the build.
      - name: Production build
        run: pnpm build
      - name: ${{ matrix.browser }} behavior tests
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --reporter=github,html,./tests/e2e/flaky-reporter.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-report-linux-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  update-snapshots:
    # Same macOS runner as the browser job, which owns the checked-in baselines.
    if: ${{ inputs.update_snapshots }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          browsers: chromium webkit
      - name: Production build
        run: pnpm build
      - name: Update visual baselines
        run: |
          pnpm exec playwright test --project=chromium --update-snapshots \
            tests/e2e/visual.spec.ts tests/e2e/controls-visual.spec.ts \
            tests/e2e/export-visual.spec.ts tests/e2e/touch.spec.ts tests/e2e/export.spec.ts
      - name: Collect changed baselines
        if: ${{ !cancelled() }}
        run: |
          mkdir -p snapshot-updates
          git ls-files --modified --others --exclude-standard -- 'tests/e2e/*-snapshots/*' > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then tar -cf - -T "$RUNNER_TEMP/changed.txt" | tar -xf - -C snapshot-updates; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: visual-baselines
          path: snapshot-updates/
          if-no-files-found: warn
          retention-days: 14
