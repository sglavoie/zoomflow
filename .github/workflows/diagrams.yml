name: Diagram lint and export

# Runs only when the CLI, the packages it bundles, or its inputs change.
on:
  pull_request:
    paths: &diagram-paths
      - packages/cli/**
      - packages/core/**
      - packages/viewer/**
      - vendor/d2/**
      - fixtures/**
      - fonts/**
      - stdlib/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .node-version
      - .github/actions/**
      - .github/workflows/diagrams.yml
  push:
    branches: [main]
    paths: *diagram-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagrams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagrams:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-d2
      - name: Build CLI
        run: pnpm --filter cli build
      - name: Lint diagram boundaries
        # Example: this repository lints a valid fixture. When copying the workflow,
        # point this step and the exports below at your project's entry diagrams.
        # A lint error exits 1 and fails the job; warnings exit 0.
        run: pnpm zoomflow lint fixtures/lint/imported.d2 --boundary-ports
      - name: Export diagrams
        run: |
          pnpm zoomflow export fixtures/order.d2 --all --format svg -o artifacts/order-svg.zip
          pnpm zoomflow export fixtures/order.d2 --all --format html -o artifacts/order.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: artifacts/
          if-no-files-found: error
