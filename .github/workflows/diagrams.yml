name: Diagram lint and export

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-d2
      - name: Build CLI
        run: pnpm --filter cli build
      - name: Lint diagram boundaries
        # Replace this valid fixture with your project's entry diagrams.
        # A lint error exits 1 and fails the job; warnings exit 0.
        run: pnpm zoomflow lint fixtures/lint/imported.d2 --boundary-ports
      - name: Export diagrams
        run: |
          pnpm zoomflow export fixtures/order.d2 --all --format svg -o artifacts/order-svg.zip
          pnpm zoomflow export fixtures/order.d2 --all --format html -o artifacts/order.html
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: artifacts/
          if-no-files-found: error
