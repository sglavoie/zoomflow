name: Set up workspace
description: Install Node, the pinned pnpm and the workspace, plus optional Playwright browsers.

inputs:
  browsers:
    description: Space-separated Playwright browsers to install, such as "chromium webkit". Empty installs none.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    # pnpm/action-setup's npm self-installer has stalled for 7 minutes on a hung registry
    # request, then downloaded pnpm a second time to switch versions. Install the exact
    # packageManager version directly, and let a hung fetch time out and retry quickly.
    - name: Install pnpm
      shell: bash
      run: |
        set -euo pipefail
        version=$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")
        npm install --global --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=4 "pnpm@$version"
        pnpm --version
    - name: Locate pnpm store
      id: pnpm
      shell: bash
      run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - name: Install workspace
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Read Playwright version
      if: inputs.browsers != ''
      id: playwright
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "key=${BROWSERS// /-}" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      if: inputs.browsers != ''
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.key }}
    # Linux needs about 120 MB of system libraries, and the runners' Ubuntu mirror has
    # stalled on both those packages and apt's index refresh for up to 30 minutes. Cache
    # the packages per runner image and install them without touching the network; a cache
    # miss, or a cached set the image no longer accepts, falls back to the mirror.
    # One entry holds the packages for every browser, so each job's key matches it
    # exactly. A per-browser key prefix-matched another set's entry, which counts as a
    # miss, and was saved only when a job got through the mirror and passed.
    - name: Restore browser system packages
      if: inputs.browsers != '' && runner.os == 'Linux'
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: apt-all-${{ steps.playwright.outputs.image }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Install cached system packages
      if: inputs.browsers != '' && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit == 'true'
      id: apt-local
      shell: bash
      run: |
        # dpkg installs exactly the cached set; apt's resolver would consult the runner's
        # stale index and try to download other versions.
        if sudo dpkg -i "$HOME"/apt-archives/*.deb; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Cached browser system packages did not install; falling back to the Ubuntu mirror."
        fi
    - name: Install system packages from the mirror
      if: inputs.browsers != '' && runner.os == 'Linux' && steps.apt-local.outputs.installed != 'true'
      shell: bash
      run: |
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-network
        # apt's own timeouts have not stopped the stalls, so each attempt gets 4 minutes and
        # a stalled mirror fails the job in about 9 instead of holding it for 30. timeout
        # runs as root so it can kill the root apt processes too. Every browser's
        # dependencies are installed, so the saved set serves all jobs.
        for attempt in 1 2; do
          if sudo timeout --kill-after=20 240 "$(command -v node)" node_modules/@playwright/test/cli.js install-deps chromium firefox webkit; then
            exit 0
          fi
          echo "::warning::Installing browser system packages from the mirror failed or stalled (attempt $attempt of 2)."
          # Finish any half-configured packages left by the killed attempt.
          sudo dpkg --configure -a || true
        done
        echo "::error::The Ubuntu mirror did not deliver the browser system packages; re-run the job."
        exit 1
    # Save right away: a later failure or cancellation would skip a post-job save.
    - name: Keep system packages for the cache
      if: inputs.browsers != '' && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/apt-archives
        if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then cp /var/cache/apt/archives/*.deb ~/apt-archives/; fi
        du -sh ~/apt-archives
    - name: Save browser system packages
      if: inputs.browsers != '' && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
      # Parallel jobs that miss together race to save; only the first succeeds.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
    # Cached browsers are not downloaded again. macOS needs no system dependencies, so a
    # cache hit skips installation entirely.
    - name: Install Playwright browsers
      if: inputs.browsers != '' && (runner.os == 'Linux' || steps.playwright-cache.outputs.cache-hit != 'true')
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      # BROWSERS is split into separate arguments on purpose.
      run: pnpm exec playwright install $BROWSERS
