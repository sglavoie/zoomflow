<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoomflow</title>
  </head>
  <body>
    <header>
      <strong>Zoomflow</strong>
      <label class="file-button">Open .d2<input id="file" type="file" accept=".d2,text/plain" /></label>
      <span id="filename">order.d2</span>
      <label>Export <select id="export-format"><option value="svg">Current board SVG</option><option value="png">Current board PNG</option><option value="zip">All boards ZIP (SVG)</option><option value="html">Single-file HTML</option></select></label>
      <button id="export" disabled>Download</button>
      <label>Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </header>
    <div id="workspace">
      <section id="source-pane" aria-label="Source editor">
        <div class="pane-title"><div>D2 source <span>Edit to update the preview</span></div><button id="format-source" title="Format D2 source (Shift+Alt+F)">Format</button></div>
        <div id="format-status" role="status" hidden></div>
        <div id="compile-error" role="alert" hidden></div>
        <div class="lint-controls">
          <span id="lint-summary" role="status">Lint pending…</span>
          <button id="show-diagnostics">Show diagnostics</button>
          <label><input id="missing-backlink" type="checkbox" /> Check parent backlinks</label>
        </div>
        <div id="editor"></div>
      </section>
      <main id="viewer" aria-label="Live preview"></main>
    </div>
    <footer>Click a shape to select its source · Linked shapes open boards (Alt+click selects source only) · Esc or Backspace outside the editor goes up</footer>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
